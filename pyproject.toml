[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-consumption-calculator"
version = "0.2.0"
description = "Standalone Windows vessel fuel consumption planning application"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6-Essentials>=6.8,<7.0",
    "playwright>=1.47,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "PyInstaller>=6.11,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp -o cache_dir=.pytest_cache"
pythonpath = ["src"]
